services:
  postgres:
    environment:
      # PostgreSQL Performance Settings
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  web:
    environment:
      - DJANGO_SETTINGS_MODULE=webmapping_project.settings.production
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  nginx:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: webmapping_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - webmapping_network

volumes:
  redis_data: